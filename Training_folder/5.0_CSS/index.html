     <style>
        *{

    <main>
        <h2>Welcome to My Website</h2>

    <script>
        let applyCSS = document.querySelector("head");
        let link_test = applyCSS.querySelector("link");
        link_test = true;

        let toggleButton = document.querySelector("button");
        console.log(toggleButton);

        // let state = true;

        const link = document.createElement("link");
        link.rel= "stylesheet";
        link.href= "./public/css/style.css";
        console.log(link);



        // const link = "<link rel="stylesheet" href="./public/css/style.css">";
        // console.log(link);

        toggleButton.addEventListener("click", () => {
            if (link_test) {
                // console.log(link_test+" state1")
                applyCSS.appendChild(link);
                // // state -=1;
            } else {
                // console.log(link_test+" state2")
                applyCSS.removeChild(link)
                // // state +=1;
            }
            
            link_test = !link_test
            // console.log(link_test)
            // console.log(!link_test)

        });
